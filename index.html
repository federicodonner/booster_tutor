<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Booster Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- Pantalla inicial -->
  <main id="start" class="screen start is-active">
    <div class="hero">
      <div class="hero-card">
        <img src="https://api.scryfall.com/cards/cae082e5-f757-4e7e-9d8c-7d916adf3308?format=image&version=normal" alt="Booster Tutor (promo Arena League 2004)" />
      </div>
      <div class="hero-text">
        <h1>Booster Tutor</h1>
        <p class="sub">Abrí un sobre de <span id="cube-name">tu cubo</span>: 15 cartas al azar, sin repetir.</p>
        <button id="open-btn" class="btn btn-primary">
          <span class="btn-label">Abrir sobre</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <!-- Pantalla del sobre -->
  <main id="pack" class="screen pack" aria-label="Sobre abierto">
    <section class="stage">
      <div id="viewer" class="viewer" aria-live="polite"></div>
    </section>

    <section class="side">
      <header class="pack-head">
        <div>
          <h2 id="card-name">—</h2>
        </div>
        <div class="counter"><span id="idx">1</span><span class="of">/ 15</span></div>
      </header>

      <div id="dock" class="dock" role="listbox" aria-label="Cartas del sobre"></div>

      <div class="actions">
        <button id="flip-btn" class="btn btn-ghost" hidden>Girar carta</button>
        <button id="reset-btn" class="btn btn-ghost">Nuevo sobre</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
